<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VozClara</title>
    <link rel="stylesheet" href="chrome.css" />
  </head>
  <body class="popup">
    <header>
      <div class="mark" aria-hidden="true"></div>
      <div>
        <strong>VozClara</strong>
        <p>WhatsApp Web → texto</p>
      </div>
    </header>

    <label>
      Provedor
      <select id="provider">
        <option value="local">Whisper neste Chrome (offline)</option>
        <option value="openai">OpenAI (Whisper)</option>
        <option value="gemini">Google Gemini</option>
        <option value="groq">Groq (Whisper)</option>
        <option value="xai">xAI (Grok STT)</option>
      </select>
    </label>

    <div id="cloud-fields" hidden>
      <label>
        Chave de API
        <input id="apiKey" type="password" spellcheck="false" autocomplete="off" placeholder="Cole a chave" />
      </label>
    </div>

    <div id="local-fields">
      <label>
        Modelo
        <select id="model">
          <option value="turbo">Turbo — recomendado (~560 MB)</option>
          <option value="tiny">Tiny — mais leve (~40 MB)</option>
          <option value="light">Small — intermediário (~120 MB)</option>
          <option value="v3">v3 — mais preciso (~1,5 GB)</option>
          <option value="nemotron">Nemotron — programa no Windows</option>
          <option value="custom">Outro Whisper — colar um link</option>
        </select>
      </label>
      <div id="custom-fields" hidden>
        <label>
          Link do modelo
          <input id="hf-repo" type="text" spellcheck="false" autocomplete="off" placeholder="https://huggingface.co/openai/whisper-tiny" />
        </label>
        <p class="hint">Cole o link de um Whisper ONNX. Nemotron é o item do seletor, não um link.</p>
      </div>
      <div class="meter" id="meter" hidden><span id="bar"></span></div>
      <p id="local-status" class="status"></p>
      <p id="local-path" class="hint" hidden></p>
      <div class="actions">
        <button id="download" type="button">Baixar e usar</button>
        <button id="reveal" type="button" class="ghost">Pasta</button>
      </div>
    </div>

    <label>
      Idioma
      <select id="language">
        <option value="pt">Português</option>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="auto">Detectar</option>
      </select>
    </label>

    <p id="status" class="status"></p>
  </body>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</html>
